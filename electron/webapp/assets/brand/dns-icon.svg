<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-label="送货宝应用图标">
  <title>送货宝</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22354E"/>
      <stop offset="1" stop-color="#0F1C2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8D57A"/>
      <stop offset="1" stop-color="#E8A93A"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEB955"/>
      <stop offset="1" stop-color="#D08C22"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="9" y="9" width="494" height="494" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- 上升箭头 -->
  <path d="M256 92 L318 172 H276 V250 H236 V172 H194 Z" fill="url(#gold)"/>

  <!-- 货箱 -->
  <rect x="90" y="276" width="192" height="142" rx="18" fill="#FFFFFF"/>
  <rect x="90" y="276" width="192" height="38" rx="18" fill="#E7ECF4"/>
  <rect x="169" y="276" width="34" height="142" fill="url(#gold)"/>

  <!-- 车头 -->
  <path d="M286 316 H360 Q372 316 378 326 L396 356 V418 H286 Z" fill="url(#gold2)"/>
  <path d="M300 330 H352 L366 356 H300 Z" fill="#DFF0FB" opacity="0.9"/>

  <!-- 车轮 -->
  <circle cx="150" cy="424" r="27" fill="#0B1420"/>
  <circle cx="150" cy="424" r="11" fill="#E8A93A"/>
  <circle cx="350" cy="424" r="27" fill="#0B1420"/>
  <circle cx="350" cy="424" r="11" fill="#E8A93A"/>
</svg>

  <header class="app-header">
    <a class="brand" href="#" aria-label="送货宝首页">
      <img src="assets/brand/dns-icon.svg" alt="送货宝" width="41" height="41">
      <span><strong>送货宝</strong></span>
    </a>
    <div class="header-search">
      <svg><use href="#i-search"/></svg>
      <input id="global-search" placeholder="搜索单号、客户或商品" aria-label="搜索单号、客户或商品" title="按 / 键快速聚焦搜索" autocomplete="off">
      <button class="hs-clear" type="button" data-action="clear-search" aria-label="清空搜索" hidden><svg><use href="#i-close"/></svg></button>
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <button class="new-order-button" data-action="new"><svg><use href="#i-plus"/></svg>新建送货单</button>
    <button class="local-account" data-module="settings" aria-label="本机设置"><span>宝</span><span><b>本机工作台</b></span><svg><use href="#i-chevron"/></svg></button>
  </header>

  <nav class="navigation" aria-label="功能导航">
    <div class="navigation-main">
      <button class="nav-item active" data-module="home" title="工作台" aria-label="工作台" aria-current="page"><svg><use href="#i-grid"/></svg><span>工作台</span></button>
      <button class="nav-item" data-module="orders" title="送货单" aria-label="送货单"><svg><use href="#i-file"/></svg><span>送货单</span></button>
      <button class="nav-item" data-module="products" title="商品资料" aria-label="商品资料"><svg><use href="#i-box"/></svg><span>商品</span></button>
      <button class="nav-item" data-module="customers" title="客户资料" aria-label="客户资料"><svg><use href="#i-people"/></svg><span>客户</span></button>
      <button class="nav-item" data-module="stats" title="统计对账" aria-label="统计对账"><svg><use href="#i-chart"/></svg><span>对账</span></button>
    </div>
    <div class="navigation-bottom"><span class="nav-divider"></span><button class="nav-item" data-module="settings" title="设置" aria-label="设置"><svg><use href="#i-settings"/></svg><span>设置</span></button><span class="version">V 1.0</span></div>
  </nav>

  <main class="workspace fixed-workspace">
    <div class="scene-surface" id="scene-surface">
      <canvas id="warehouse" aria-label="仓库业务导航示意图，功能也可通过左侧导航操作"></canvas>
      <div class="scene-vignette"></div>
      <div class="scene-markers" id="scene-markers"></div>
      <div class="scene-loading" id="scene-loading"><span></span>正在布置你的送货现场…</div>
    </div>

    <div class="fixed-workspace-heading"><h1>送货现场</h1><span id="today-label"></span></div>

    <div class="scene-tool-row">
      <div class="scene-breadcrumb"><svg><use href="#i-home"/></svg><span id="scene-section">场景总览</span><span class="scene-breadcrumb-slash">/</span><span id="scene-context">从一张送货单开始</span></div>
      <div class="scene-tools"><button data-action="reset-view" title="回到总览" aria-label="回到总览"><svg><use href="#i-expand"/></svg></button><button data-action="motion" title="暂停场景动画" aria-label="暂停场景动画" aria-pressed="false"><svg><use href="#i-pause"/></svg></button><span></span><button data-action="lighting" title="切换日夜场景" aria-label="切换日夜场景" aria-pressed="false"><svg><use href="#i-sun"/></svg></button></div>
    </div>

    <section id="dispatch-panel" class="fixed-pane dispatch-pane" aria-labelledby="dispatch-title">
      <header class="fixed-pane-heading"><h2 id="dispatch-title">今日送货</h2><button class="fixed-text-button" data-action="dispatch-expand">全部单据</button></header>
      <div id="dispatch-body" class="fixed-pane-body" data-desktop-scroll></div>
      <div id="dispatch-collection" class="fixed-view-host fixed-pane-body" data-desktop-scroll hidden></div>
    </section>
    <section id="statistics-panel" class="fixed-pane statistics-pane" aria-labelledby="statistics-title">
      <header class="fixed-pane-heading"><h2 id="statistics-title">统计对账</h2><button class="fixed-text-button" data-action="statistics-expand">展开</button></header>
      <div id="statistics-summary" class="fixed-pane-body"></div>
      <div id="statistics-view" class="fixed-view-host fixed-pane-body" data-desktop-scroll hidden></div>
    </section>
    <section id="context-panel" class="fixed-pane selection-pane" aria-labelledby="selection-title">
      <header class="fixed-pane-heading"><h2 id="selection-title">当前单据</h2><button class="fixed-text-button" data-action="selection-expand">详细查看</button></header>
      <div id="selection-summary" class="fixed-pane-body"></div>
      <div id="selection-view" class="fixed-view-host fixed-pane-body" data-desktop-scroll hidden></div>
      <div id="selection-actions" class="fixed-selection-actions" hidden></div>
    </section>

    <div class="scene-footnote"><i></i><span>场景用于业务导航，不代表实时库存或物流状态</span><span class="scene-render-note">NATIVE 3D</span></div>
  </main>
